cartpole1:
  env_id: CartPole-v1
  replay_memory_size: 100000
  mini_batch_size: 32
  epsilon_init: 1 #100% random change decreasing to epsilon_min
  epsilon_decay: 0.999
  epsilon_min: 0.05 #5% chance that agent takes random action
  network_sync_rate: 10
  learning_rate_a: 0.0001
  discount_factor_g: 0.99
  stop_on_reward: 100000
  fc1_nodes: 10
  enable_double_dqn: True

flappybird1:
  env_id: FlappyBird-v0
  learning_rate_a: 0.0005
  discount_factor_g: 0.99
  network_sync_rate: 10
  replay_memory_size: 50000
  mini_batch_size: 64
  epsilon_init: 1 #100% random change decreasing to epsilon_min
  epsilon_decay: 0.99
  epsilon_min: 0.05 #5% chance that agent takes random action
  stop_on_reward: 100000
  fc1_nodes: 4096
  env_make_params:
    use_lidar: False
  enable_double_dqn: True
  enable_dueling_dqn: True

donkeykong1:
  env_id: ALE/DonkeyKong-v5
  learning_rate_a: 0.0005
  discount_factor_g: 0.99
  network_sync_rate: 10
  replay_memory_size: 50000
  mini_batch_size: 16
  epsilon_init: 1 #100% random change decreasing to epsilon_min
  epsilon_decay: 0.999
  epsilon_min: 0.05 #5% chance that agent takes random action
  stop_on_reward: 100000
  fc1_nodes: 512
  env_make_params:
    #use_pixels: false  # or whatever disables image obs
  enable_double_dqn: True
  enable_dueling_dqn: True

